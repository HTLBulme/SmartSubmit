services:
  db:
    image: mysql/mysql-server:8.0
    container_name: smartsubmit-mysql-db
    env_file:
      - ./backend/.env   
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql          
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
      interval: 5s

  backend:
    # For production deployment (pulls pre-built image from GitHub)
    image: ghcr.io/htlbulme/smartsubmit-backend:latest
    
    # For local development (builds from Dockerfile)    
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    environment:
      # Load these from .env on the host
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3000
      HOST: "0.0.0.0"
      # Docker-specific overrides
      IS_DOCKER: "true"
      DATABASE_URL: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}"
      DATABASE_DOCKER_URL: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}"
    ports:
      - "8080:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: always
    working_dir: /app
    command: >
      sh -c "
      cd backend &&
      npx prisma generate &&
      npx prisma migrate deploy &&
      npx prisma db seed &&
      cd .. &&
      node backend/smartsubmit_app.js
      "
    container_name: smartsubmit-backend-service

volumes:
  db-data: