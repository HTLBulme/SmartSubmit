name: CI/CD Deployment to OCI

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        
      - name: Setup Node.js 20 environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Install Backend Dependencies
        run: npm install --prefix ./backend
        
      - name: Install Frontend Dependencies
        run: npm install --prefix ./frontend
        
      - name: Run Backend Tests
        run: npm run test --prefix ./backend
        
      - name: Run Frontend Tests
        run: npm run test --prefix ./frontend
  
  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Convert repository name to lowercase
        id: repo_name
        run: echo "lowercase=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.repo_name.outputs.lowercase }}-backend:latest
          cache-from: type=registry,ref=ghcr.io/${{ steps.repo_name.outputs.lowercase }}-backend:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ steps.repo_name.outputs.lowercase }}-backend:buildcache,mode=max
        
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Convert repository name to lowercase
        id: repo_name
        run: echo "lowercase=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
        
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add OCI VM to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 79.76.119.73 >> ~/.ssh/known_hosts 2>&1 || true
          chmod 644 ~/.ssh/known_hosts
          
      - name: Deploy to OCI VM
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 ubuntu@79.76.119.73 "
            cd /home/ubuntu/SmartSubmit
            
            echo '=== Pulling latest code ==='
            git pull origin main
            
            echo '=== Login to GitHub Container Registry ==='
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            echo '=== Pulling Docker image ==='
            docker pull ghcr.io/${{ steps.repo_name.outputs.lowercase }}-backend:latest
            
            echo '=== Stopping containers ==='
            docker compose down
            
            echo '=== Starting database ==='
            docker compose up -d db
            sleep 8
            
            echo '=== Running migrations ==='
            docker compose run --rm backend sh -c 'cd backend && npx prisma migrate deploy'
            
            echo '=== Starting all services ==='
            docker compose up -d
            
            echo '=== Cleaning up ==='
            docker image prune -f
            
            echo '=== Deployment complete ==='
            docker compose ps
          "