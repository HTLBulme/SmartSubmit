name: CI/CD Deployment to OCI

on:
  push:
    branches:
      - main 

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        
      - name: Setup Node.js 20 environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Install Backend Dependencies
        run: npm install --prefix ./backend
        
      - name: Install Frontend Dependencies
        run: npm install --prefix ./frontend
        
      - name: Run Backend Tests
        run: npm run test --prefix ./backend
        
      - name: Run Frontend Tests (if needed)
        run: npm run test --prefix ./frontend
        
  deploy:
    runs-on: ubuntu-latest
    needs: test 

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
      
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add OCI VM to known_hosts
        env:
          SSH_HOST: 79.76.119.73
        run: |
          echo "Adding $SSH_HOST to known_hosts..."
          ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts
          
      - name: Execute Deployment Commands on OCI VM
        env:
          SSH_USER: ubuntu
          SSH_HOST: 79.76.119.73 
          PROJECT_PATH: /home/ubuntu/SmartSubmit
          
        run: |
          echo "Starting deployment on OCI VM: $SSH_HOST"
          
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 $SSH_USER@$SSH_HOST "
            set -e
            cd $PROJECT_PATH
            
            echo '=== Pulling latest code ==='
            git pull origin main
            
            echo '=== Stopping containers ==='
            docker-compose down
            
            echo '=== Building with cache (faster) ==='
            docker-compose build backend
            
            echo '=== Starting database ==='
            docker-compose up -d db
            sleep 8
            
            echo '=== Running migrations ==='
            docker-compose run --rm backend sh -c 'cd backend && npx prisma migrate deploy'
            
            echo '=== Starting all services ==='
            docker-compose up -d
            
            echo '=== Cleaning up old images ==='
            docker image prune -f
            
            echo '=== Deployment complete ==='
            docker-compose ps
            df -h / | grep -E 'Filesystem|/$'
          "